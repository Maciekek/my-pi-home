server {
        listen 80;

        server_name https://temperaturki.bieda.it;

        # Everything requires a login, except the device ingest endpoints below.
        # The password file lives only on the server (see docker-compose-prod.yml).
        auth_basic           "my-pi-home";
        auth_basic_user_file /etc/nginx/.htpasswd;

       location / {
               # First attempt to serve request as file, then
               # as directory, then fall back to displaying a 404.
               # try_files $uri $uri/ =404;
               proxy_pass http://client:3000;
               proxy_http_version 1.1;
               proxy_set_header Upgrade $http_upgrade;
               proxy_set_header Connection 'upgrade';
               proxy_set_header Host $host;
               proxy_cache_bypass $http_upgrade;
       }

       # Icons and manifest are fetched by browsers/phones without credentials.
       location ~ ^/(favicon\.ico|favicon\.svg|apple-touch-icon\.png|logo192\.png|logo512\.png|manifest\.json)$ {
               auth_basic off;
               proxy_pass http://client:3000;
               proxy_set_header Host $host;
       }

       location /api {
               # First attempt to serve request as file, then
               # as directory, then fall back to displaying a 404.
               # try_files $uri $uri/ =404;
               proxy_pass http://main-server:8888;
               proxy_http_version 1.1;
               proxy_set_header Upgrade $http_upgrade;
               proxy_set_header Connection 'upgrade';
               proxy_set_header Host $host;
               proxy_cache_bypass $http_upgrade;
       }

       # Devices that cannot be updated post readings here without credentials.
       # Only POST is open; reading temps still requires a login.
       location = /api/temps {
               auth_basic off;
               limit_except POST {
                       auth_basic           "my-pi-home";
                       auth_basic_user_file /etc/nginx/.htpasswd;
               }
               proxy_pass http://main-server:8888;
               proxy_set_header Host $host;
       }

       # ESP devices (ESPEasy) report readings with a GET request.
       location = /api/esp/ds18b20 {
               auth_basic off;
               proxy_pass http://main-server:8888;
               proxy_set_header Host $host;
       }

       location /socket {
                      # First attempt to serve request as file, then
                      # as directory, then fall back to displaying a 404.
                      # try_files $uri $uri/ =404;
                      proxy_pass http://main-server:8888;
                      proxy_http_version 1.1;
                      proxy_set_header Upgrade $http_upgrade;
                      proxy_set_header Connection 'upgrade';
                      proxy_set_header Host $host;
                      proxy_cache_bypass $http_upgrade;
              }


  	error_page 400 404 500 502 503 504 /error.html;
        location = /error.html {
               auth_basic off;
               root /usr/share/nginx/html;
               internal;
	}

}
