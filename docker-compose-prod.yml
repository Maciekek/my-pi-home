version: "3.8"
services:
  mongo:
    image: mongo:7.0
    # Host-only: Mongo runs without auth, never publish it on 0.0.0.0.
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - db
    volumes:
      - mongodb:/data/db

  main-server:
    image: maciekek/my-pi-home-server:master
    restart: always
    # Only reachable from this host; public traffic must go through nginx (basic auth).
    ports:
      - "127.0.0.1:8888:8888"
    depends_on:
      - mongo
    env_file:
      - main-server/.env
    networks:
      - db
      - app

  client:
    image: maciekek/my-pi-home-client:master
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - app

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile-prod
    ports:
      - "8080:80"
    volumes:
      # Create on the server: htpasswd -c nginx/.htpasswd <user>  (not committed)
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - app
    depends_on:
      - main-server
      - mongo

  fetcher:
    build:
      context: ./fetcher
      dockerfile: Dockerfile-prod

volumes:
   mongodb:

networks:
  db:
  app:
